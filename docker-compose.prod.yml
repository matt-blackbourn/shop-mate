services:
  php:
    build: .
    container_name: shopmate-php
    depends_on:
      - db
    environment:
      APP_ENV: prod
      APP_DEBUG: 1       # temporarily for debugging, set 0 for final prod
      DATABASE_URL: mysql://matt:404404@db:3306/shopmate

  web:
    image: nginx:alpine
    container_name: shopmate-web
    depends_on:
      - php
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"

  db:
    image: mysql:8.0
    container_name: shopmate-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 404404
      MYSQL_DATABASE: shopmate
      MYSQL_USER: matt
      MYSQL_PASSWORD: 404404
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
